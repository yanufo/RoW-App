services:
  row-app:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8501:8501"

    volumes:
      - /home:/home
      - /data:/data
      - /inspection:/inspection
      # - /home/gve/.streamlit:/root/.streamlit
      - /home/gve/Downloads/row_inspection_renew/models:/models
      - /inspection/config.yml:/inspection/config.yml

    env_file:
      - .env

    depends_on:
      - mysql

    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

    networks:
      - meiji-network



  mysql:
    image: mysql:8.0
    container_name: row-mysql
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - meiji-network


volumes:
  mysql_data:

networks:
  meiji-network:
    external: true